# XcodeGen spec (https://github.com/yonaskolb/XcodeGen).
# The committed DeskMode.xcodeproj already works with Xcode 16+; this file is a fallback
# to regenerate it: `brew install xcodegen && xcodegen generate`.
name: DeskMode
options:
  bundleIdPrefix: com.micull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
targets:
  DeskMode:
    type: application
    platform: iOS
    sources:
      - path: DeskMode
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.micull.DeskMode
        INFOPLIST_FILE: DeskMode/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
